[package]
name = "open-slide-desktop"
version = "0.2.0"
description = "Desktop shell for open-slide"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "open_slide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
